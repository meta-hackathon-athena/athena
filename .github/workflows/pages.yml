# Publishes the Athena web app as a static preview on GitHub Pages.
# On github.io the app runs in fixture mode (frontend/web/public/fixtures.js), with no backend.
name: app preview

on:
  push:
    branches: [main]
    paths: ["frontend/web/public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/web/public
      - id: deployment
        uses: actions/deploy-pages@v4
