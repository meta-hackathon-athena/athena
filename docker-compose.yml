# Shared FalkorDB for the Vixy runtime and the Dreamer (one server, graph vixy_<user_id>).
#   docker compose up -d falkordb      # then: export FALKORDB_URL=redis://localhost:6390
# Host port 6390 (not 6379) so it does not collide with a local Redis.
# Data lives in the named volume vixy_falkordb_data and survives container restarts
# (AOF + RDB). `docker compose down -v` deletes it.
name: vixy

services:
  falkordb:
    # pinned by digest (FalkorDB on Redis 8.10.2, image built 2026-10-22)
    image: falkordb/falkordb@sha256:0fb85036662ce3d1206530a38fdf7df5a92b1fb31ad23087f8d4e89038ce0812
    ports:
      - "127.0.0.1:${VIXY_FALKORDB_PORT:-6390}:6379"
    environment:
      BROWSER: "0"                                    # no web UI in the backend stack
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 25 TIMEOUT 30000 RESULTSET_SIZE 10000"
    volumes:
      - vixy_falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  vixy_falkordb_data:
