<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Athena</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="fixture-banner" class="fixture-banner" hidden>
    Fixture preview: an offline snapshot of real API responses. Answers here are not sent to Athena.
    <a href="./#/clarify">Use the live backend</a>
  </div>
  <header class="topbar">
    <a class="brand" href="#/clarify" aria-label="Athena home">
      <img src="logo.svg" alt="" width="30" height="30">
      <span>Athena</span>
    </a>
    <nav class="tabs" aria-label="Screens">
      <a href="#/clarify" data-route="clarify">Clarify <span class="count" id="ask-count" hidden></span></a>
      <a href="#/memories" data-route="memories">Memories</a>
    </nav>
  </header>
  <main id="app" tabindex="-1"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
